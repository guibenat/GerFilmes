spring.application.name=cinema-reservas
server.port=8080

# Banco de dados PostgreSQL (valores de variáveis de ambiente)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ? Code First: cria/atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT ? chave secreta e tempo de expiração (86400000ms = 24h)
jwt.secret=${JWT_SECRET:cinema-reservas-chave-secreta-deve-ter-pelo-menos-256-bits}
jwt.expiration=86400000

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Admin inicial ? criado automaticamente pelo DataInitializer na primeira execução
admin.email=${ADMIN_EMAIL:admin@cinema.com}
admin.senha=${ADMIN_SENHA:Admin@123}